name: Deploy Site
# Legacy iSH (Netlify) — neutralisé (2026-07), manuel uniquement.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Deploy
      run: curl -d {} $NETLIFY_DEPLOY_HOOK
      env:
        NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
